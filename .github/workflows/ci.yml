name: GitHub Actions Demo
on: 
    push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install the node version
        uses: actions/setup-node@v6
        with:
            node-version: 24

      - name: Create cluster
        uses: helm/kind-action@v1
        
      - name: Install dependencies
        run: npm ci

      - name: Build the docker image
        run: docker build -t node-app ./app

      - name: Load the image into the cluster
        run: kind load docker-image node-app:latest

      - name: Deploy via helm
        run:  helm upgrade --install samplenode-app ./helm

      - name: Verify the deployment
        run : kubectl rollout status deployment/samplenode-app

      - name: Check the status of the pods
        run: kubectl get pods

      
