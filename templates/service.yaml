apiVersion: v1
kind: Service

metadata:
  name: {{ include "samplenode-app.serviceName" . }}
  labels:
    {{- include "samplenode-app.labels" . | nindent 4 }}

spec:
  selector:
    {{- include "samplenode-app.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  type: {{ .Values.service.type }}