apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "samplenode-app.name" . }}
  labels:
    {{- include "samplenode-app.labels" . | nindent 4 }}

spec:
  replicas: 1

  selector:
    matchLabels:
      {{- include "samplenode-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "samplenode-app.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ include "samplenode-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}